[package]
name = "mongo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1"
chrono = "0.4"
futures = "0.3"
futures-util = "0.3"
bytes = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "query"] }
envmnt = "0.10"
serde_json = "1"
serde_repr = "0.1"
erased-serde = "0.4"
env_logger = "0.11"
lazy_static = "1"
regex = "1"
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7", features = ["trace"] }
base64 = "0.23"
async-trait = "0.1"
lettre = "0.11.23"
v = "0.1.0"
thiserror = "2.0.21"
mongodb = "3.9.1"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "lib"
path = "src/lib/lib.rs"
